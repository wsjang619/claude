name: 전세 매물 알림

on:
  schedule:
    - cron: "17 22,1,4,7,10,13 * * *"   # 07:17~22:17 KST, 3시간 간격
  workflow_dispatch:
    inputs:
      dry_run:
        description: "메일 발송·상태 저장 없이 결과만 출력"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write      # SMTP 시크릿이 없을 때 알림을 이슈로 남기기 위해

concurrency:
  group: state-commit
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 매물 조회 및 메일 발송
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          NAVER_LAND_TOKEN: ${{ secrets.NAVER_LAND_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then python -m cheongyak_alert --listings --dry-run; else python -m cheongyak_alert --listings; fi
      - name: 알린 매물 기록 커밋
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase -q || true
          git add -A state/
          git diff --cached --quiet || { git commit -m "chore: 알린 전세 매물 기록 갱신"; git push; }
