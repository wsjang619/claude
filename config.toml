# 별내동 인근 청약 알림 설정

[search]
lookback_days = 60          # 최근 며칠 이내 모집공고까지 조회할지
include_closed = false      # 접수가 이미 끝난 공고도 알릴지
remind_days_before = 1      # 접수 시작 N일 전(당일 포함)에 한 번 더 알림

[mail]
to = "jos5324@gmail.com"          # 알림 수신 주소 (환경변수 MAIL_TO가 있으면 그쪽이 우선)
fallback_issue = true             # SMTP 시크릿이 없으면 GitHub 이슈를 만들어 GitHub이 이메일로 알리게 함 (Actions 전용)

# 별내동에 가까울수록 rank가 작다. 공고명+주소에 keywords 중 하나라도 있으면 해당 지역으로 분류한다.
[[areas]]
name = "별내동"
rank = 1
keywords = ["별내"]

[[areas]]
name = "남양주시"
rank = 2
keywords = ["남양주"]

[[areas]]
name = "인근(구리·의정부)"
rank = 3
keywords = ["구리시", "갈매", "의정부시"]

[[areas]]
name = "경기북부 광역공고(대상 지역 확인 필요)"
rank = 4
keywords = ["경기북부", "경기 북부"]

# 내 조건 체크 문구와 가점 추정에 쓰인다. 지우면 해당 문구는 메일에서 빠진다.
[profile]
birth_year = 1990
married_on = "2018-05"                   # 혼인신고 연-월(일을 알면 2018-05-17 형식)
children_born = ["2024-08", "2024-08"]   # 쌍둥이
homeless = true                          # 가정값: 무주택세대구성원. 다르면 false
extra_dependents = 0                     # 배우자·자녀 외 부양가족(직계존속 등) 수
# account_open = "2016-01"               # 청약통장 가입 연-월. 넣으면 가점에 통장 점수 포함

[applyhome]
enabled = true
region = "경기"
special_supply_detail = true             # APT 공고의 특별공급 유형별 세대수 조회
# endpoints = ["getAPTLttotPblancDetail"]  # 기본은 APT·무순위·오피스텔/도시형·공공지원민간임대·임의공급 전체

[lh]
enabled = true
# endpoint = "https://apis.data.go.kr/B552555/lhNoticeInfo1/getNoticeInfo1"
region_code = "41"                       # 경기도

[state]
path = "state/seen.json"

# ── 전세 매물 알림 (python -m cheongyak_alert --listings) ──────────────────
[listings]
enabled = true
max_items_per_mail = 30          # 한 번에 메일에 싣는 최대 건수 (나머지는 건수만 표시)
state_path = "state/listings.json"

[listings.criteria]
real_estate_types = ["APT", "VL"]   # APT 아파트 / VL 빌라·연립·다세대주택
max_deposit = 30000                 # 전세 보증금 상한 (만원) = 3억
area_min = 59                       # 전용면적 (㎡)
area_max = 85

[listings.naver]
delay_seconds = 2                   # 요청 사이 대기. 차단을 피하려고 줄이지 않는 것을 권장

[listings.market]
enabled = true                      # 메일에 국토부 전세 실거래 시세 참고를 붙임 (DATA_GO_KR_SERVICE_KEY 필요)
months = 3

# 청약 알림의 areas와 같은 생활권. path는 경기도 아래 (시군구, 읍면동) 이름, lawd_cd는 시군구 코드.
[[listings.areas]]
name = "별내동"
rank = 1
path = ["남양주시", "별내동"]
lawd_cd = "41360"
dong = "별내동"
lat = 37.6437      # 지도 링크 중심 (대략값)
lon = 127.1279

[[listings.areas]]
name = "다산동"
rank = 2
path = ["남양주시", "다산동"]
lawd_cd = "41360"
dong = "다산동"
lat = 37.61      # 지도 링크 중심 (대략값)
lon = 127.15

[[listings.areas]]
name = "퇴계원읍"
rank = 2
path = ["남양주시", "퇴계원읍"]
lawd_cd = "41360"
dong = "퇴계원읍"
lat = 37.6485      # 지도 링크 중심 (대략값)
lon = 127.1436

[[listings.areas]]
name = "구리 갈매동"
rank = 3
path = ["구리시", "갈매동"]
lawd_cd = "41310"
dong = "갈매동"
lat = 37.6339      # 지도 링크 중심 (대략값)
lon = 127.1137
